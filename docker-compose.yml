services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bizora
      POSTGRES_PASSWORD: bizora
      POSTGRES_DB: bizora
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://bizora:bizora@db:5432/bizora
      JWT_SECRET: ${JWT_SECRET:-change-me}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  pgdata:
